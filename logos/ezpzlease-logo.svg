<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <radialGradient id="lg_g" cx="38%" cy="32%" r="72%">
      <stop offset="0%"   stop-color="#F8E46A"/>
      <stop offset="55%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#7A5A18"/>
    </radialGradient>
    <clipPath id="lg_c">
      <circle cx="40" cy="40" r="38"/>
    </clipPath>
  </defs>

  <!-- ── CIRCULAR BADGE ── -->
  <g clip-path="url(#lg_c)">
    <circle cx="40" cy="40" r="38" fill="url(#lg_g)"/>
    <ellipse cx="30" cy="24" rx="22" ry="12" fill="white" fill-opacity="0.1"/>
    <!-- Wheels -->
    <circle cx="24" cy="56" r="10" fill="#0E0E0E"/>
    <circle cx="24" cy="56" r="5.5" fill="#2A2A2A"/>
    <circle cx="24" cy="56" r="2.2" fill="#0E0E0E"/>
    <circle cx="58" cy="56" r="10" fill="#0E0E0E"/>
    <circle cx="58" cy="56" r="5.5" fill="#2A2A2A"/>
    <circle cx="58" cy="56" r="2.2" fill="#0E0E0E"/>
    <!-- Body sill -->
    <rect x="5"  y="43" width="70" height="11" rx="3" fill="#0A0A0A"/>
    <!-- Front splitter -->
    <path d="M 5,44 L 2,47 L 2,54 L 5,54 Z" fill="#0A0A0A"/>
    <!-- Rear diffuser -->
    <path d="M 75,44 L 78,47 L 78,52 L 75,52 Z" fill="#0A0A0A"/>
    <!-- Cabin -->
    <path d="M 20,43 L 27,22 L 57,22 L 65,43 Z" fill="#0A0A0A"/>
    <!-- Windshield -->
    <path d="M 22,42 L 28,23 L 40,23 L 40,42 Z" fill="#181818"/>
    <!-- Rear window -->
    <path d="M 42,42 L 42,23 L 54,23 L 63,42 Z" fill="#181818"/>
    <!-- Rear wing -->
    <rect x="57" y="17" width="18" height="3.5" rx="1.5" fill="#0A0A0A"/>
    <rect x="72" y="17" width="3"  height="6"   rx="1"   fill="#0A0A0A"/>
    <!-- LED headlight -->
    <rect x="5"  y="45.5" width="7" height="1.8" rx="0.9" fill="#FFFDE0" opacity="0.97"/>
    <!-- LED taillight -->
    <rect x="68" y="45.5" width="7" height="1.8" rx="0.9" fill="#FF2020" opacity="0.92"/>
    <!-- Ground shadow -->
    <ellipse cx="40" cy="74" rx="32" ry="4" fill="#0A0A0A" fill-opacity="0.3"/>
  </g>
  <!-- Badge border -->
  <circle cx="40" cy="40" r="37.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <circle cx="40" cy="40" r="38"   fill="none" stroke="#6A4A10" stroke-width="0.8"/>

  <!-- ── WORDMARK ── -->
  <text x="94" y="46"
    font-family="Inter,'Arial Black',Arial,sans-serif"
    font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="-1.5">EzPz</text>

  <line x1="94" y1="54" x2="238" y2="54"
    stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.45"/>

  <text x="96" y="67"
    font-family="Inter,Arial,sans-serif"
    font-weight="700" font-size="13" fill="#C9A84C" letter-spacing="6">LEASE</text>
</svg>
